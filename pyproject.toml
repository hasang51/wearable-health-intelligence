[project]
name = "wearable-health-intelligence"
version = "0.4.0"
description = "Secure local structural audit, PPG packet forensics, candidate reconstruction, and evidence dashboard for wearable health session CSVs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.18",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "scipy>=1.11",
    "streamlit>=1.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
neurokit = [
    "neurokit2>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
